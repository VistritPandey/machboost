name: MachBoost
options:
  bundleIdPrefix: com.vistritpandey
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4
settings:
  base:
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: 0.10.0
    SWIFT_VERSION: 6.0
targets:
  MachBoostDaemonClient:
    type: framework
    platform: macOS
    sources:
      - path: MachBoostDaemonClient
    settings:
      base:
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.vistritpandey.MachBoostDaemonClient
  MachBoostPersistence:
    type: framework
    platform: macOS
    sources:
      - path: MachBoostPersistence
    settings:
      base:
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.vistritpandey.MachBoostPersistence
  MachBoost:
    type: application
    platform: macOS
    sources:
      - path: MachBoost
    resources:
      - path: Resources
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: MachBoost/MachBoost.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.vistritpandey.MachBoost
        PRODUCT_NAME: MachBoost
        INFOPLIST_FILE: MachBoost/Info.plist
    dependencies:
      - target: MachBoostDaemonClient
        embed: true
      - target: MachBoostPersistence
        embed: true
      - package: Sparkle
  MachBoostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MachBoostTests
    dependencies:
      - target: MachBoost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.vistritpandey.MachBoostTests
  MachBoostUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MachBoostUITests
    dependencies:
      - target: MachBoost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.vistritpandey.MachBoostUITests
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  MachBoost:
    build:
      targets:
        MachBoost: all
        MachBoostTests: [test]
        MachBoostUITests: [test]
    test:
      gatherCoverageData: true
      environmentVariables:
        MACHBOOST_TESTING: "1"
      targets:
        - MachBoostTests
        - MachBoostUITests
