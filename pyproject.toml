[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "machboost"
version = "0.1.0"
description = "Exact local-context speculative acceleration for local LLM inference."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Vistrit Pandey", email = "vistrit@blinkfire.com" }
]
keywords = ["llm", "inference", "speculative-decoding", "local-ai", "mlx", "huggingface", "ollama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
hf = [
  "torch",
  "transformers",
]
mlx = [
  "mlx",
  "mlx-lm",
]
all = [
  "torch",
  "transformers",
  "mlx",
  "mlx-lm",
]

[project.scripts]
machboost = "machboost.cli:main"

[project.urls]
Homepage = "https://github.com/VistritPandey/machboost"
Repository = "https://github.com/VistritPandey/machboost"
Issues = "https://github.com/VistritPandey/machboost/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["machboost*"]
