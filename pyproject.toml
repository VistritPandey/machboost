[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "machboost"
version = "0.16.1"
description = "Resident local inference server with conditional text and visual acceleration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "vlm", "inference", "speculative-decoding", "local-ai", "mlx", "huggingface", "ollama", "server", "concurrency"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=2.1.1,<3",
]

[project.optional-dependencies]
hf = [
  "torch",
  "transformers",
]
mlx = [
  "mlx",
  "mlx-lm",
]
vision = [
  "mlx-vlm>=0.6.13",
  "Pillow",
]
dflash = [
  "dflash-mlx>=0.1.8",
  "mlx>=0.31",
  "mlx-lm>=0.31",
]
video = [
  "Pillow",
]
all = [
  "torch",
  "transformers",
  "mlx",
  "mlx-lm",
  "mlx-vlm>=0.6.13",
  "dflash-mlx>=0.1.8",
  "Pillow",
]

[project.scripts]
machboost = "machboost.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["machboost*"]
