name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python package
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Check package metadata
        run: python -m pip install --dry-run .
      - name: Check CLI
        run: |
          machboost doctor --json
          machboost self-test --json

  go:
    name: Go CLI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Run Go tests
        run: go test ./...

  macos-app:
    name: Native macOS app
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install daemon and project generator
        run: |
          python -m pip install -e .
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum --algorithm 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Regenerate Xcode project
        working-directory: apps/macos
        run: |
          xcodegen generate
          git diff --exit-code MachBoost.xcodeproj
      - name: Validate macOS release scripts
        run: |
          find scripts -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n
      - name: Run native unit tests
        env:
          MACHBOOST_SOURCE_ROOT: ${{ github.workspace }}
          MACHBOOST_TESTING: "1"
        run: |
          xcodebuild test \
            -project apps/macos/MachBoost.xcodeproj \
            -scheme MachBoost \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MachBoostTests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=
      - name: Run native UI tests
        env:
          MACHBOOST_SOURCE_ROOT: ${{ github.workspace }}
          MACHBOOST_TESTING: "1"
        run: |
          xcodebuild test \
            -project apps/macos/MachBoost.xcodeproj \
            -scheme MachBoost \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MachBoostUITests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=
